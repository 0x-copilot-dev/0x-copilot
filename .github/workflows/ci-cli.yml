# CLI package checks for tools/cli (@0x-copilot/cli).
# The launcher is dependency-free at runtime for version/help/doctor
# (electron is required lazily only when staging/launching), so these
# checks need no `npm install` — they stay fast and deterministic.

name: ci-cli

on:
  pull_request:
    paths:
      - "tools/cli/**"
      - "tools/desktop-runtime/**"
      - "apps/desktop/**"
      - "apps/frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-cli.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "tools/cli/**"
      - "tools/desktop-runtime/**"
      - "apps/desktop/**"
      - "apps/frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-cli.yml"
  workflow_dispatch:

concurrency:
  group: ci-cli-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli:
    name: cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Syntax check all sources
        run: npm run check

      - name: Smoke — version / help (dependency-free import graph)
        run: npm run smoke

      - name: Validate published file list (npm pack manifest)
        run: node scripts/pack-manifest-check.mjs

  packed-payload:
    name: packed CLI payload
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      # tools/desktop-runtime ships inside the CLI tarball, and until now nothing
      # ran its node:test files at all — `grep -rn -- --test .github/workflows/`
      # matched only the CLI's own suite. They cover the staging modules this job
      # then packs, so this is their natural home.
      - name: Test desktop-runtime staging modules
        # Glob UNQUOTED so bash expands it. This job runs Node 20, where
        # `node --test` does not expand glob patterns itself — quoting it made
        # node look for a literal file named "*.test.mjs" and fail with
        # "Could not find". The desktop workflow gets away with the quoted form
        # only because it runs Node 22.
        run: node --test tools/desktop-runtime/*.test.mjs

      - name: Build payload inputs
        run: |
          npm run build --workspace @0x-copilot/desktop
          npm run build --workspace @0x-copilot/frontend

      - name: Assemble and inspect the actual npm tarball
        run: |
          COPILOT_SKIP_BUILD=1 npm run assemble --workspace @0x-copilot/cli
          npm run check:packed --workspace @0x-copilot/cli
