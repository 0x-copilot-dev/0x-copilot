name: ci-e2-final-conformance

# E2 D9 is a release gate, but the repository is intentionally not at the
# cutover state yet. PR/push runs therefore publish a deterministic report and
# prove its canaries; a release operator dispatches this workflow with
# `require_all=true`, which fails closed on any FAIL or BLOCKED row.
on:
  pull_request:
    paths:
      - "services/ai-backend/**"
      - "services/backend/**"
      - "services/backend-facade/**"
      - "packages/api-types/**"
      - "packages/chat-surface/**"
      - "packages/chat-transport/**"
      - "packages/design-system/**"
      - "packages/service-contracts/**"
      - "packages/surface-renderers/**"
      - "apps/desktop/**"
      - "tools/check_e2_final_conformance.py"
      - "tools/check_service_boundaries.py"
      - ".github/workflows/ci-e2-final-conformance.yml"
  push:
    branches: [main, dev]
    paths:
      - "services/ai-backend/**"
      - "services/backend/**"
      - "services/backend-facade/**"
      - "packages/api-types/**"
      - "packages/chat-surface/**"
      - "packages/chat-transport/**"
      - "packages/design-system/**"
      - "packages/service-contracts/**"
      - "packages/surface-renderers/**"
      - "apps/desktop/**"
      - "tools/check_e2_final_conformance.py"
      - "tools/check_service_boundaries.py"
      - ".github/workflows/ci-e2-final-conformance.yml"
  workflow_dispatch:
    inputs:
      require_all:
        description: "Fail unless every E2 D9 condition passes"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  report-and-canaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/ai-backend/requirements.txt
            services/ai-backend/requirements-dev.txt
      - name: Install D9 runner dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./packages/service-contracts
          # requirements-dev.txt carries the PINNED test tooling. An ad-hoc
          # `pip install pytest` here is what left this job with pytest but no
          # pytest-asyncio, so every async canary errored out.
          python -m pip install -r services/ai-backend/requirements-dev.txt
      # Two invocations, deliberately. Mixing `services/ai-backend/tests/...`
      # with `../../tools/...` in ONE pytest run makes pytest resolve rootdir to
      # services/ai-backend and adopt its pyproject.toml as the config authority
      # for a repo-root tool test that lives outside that project. The tools file
      # is then imported under a different module name, its own directory never
      # reaches sys.path, and its sibling import fails at collection:
      #
      #   ModuleNotFoundError: No module named 'check_service_boundaries'
      #
      # Each project therefore runs under its own rootdir. The sibling workflows
      # (ci-dark-capabilities-gate, ci-orphan-destinations) already invoke their
      # tools tests from the repo root and were never affected.
      - name: Prove D9 runner and planted canaries
        run: |
          cd services/ai-backend
          PYTHONPATH="../../packages/service-contracts/src:src" python -m pytest \
            tests/unit/agent_runtime/release/test_e2_final_conformance.py \
            tests/unit/runtime_worker/test_mcp_operation_composition.py \
            tests/unit/runtime_worker/test_builtin_rowset_effect_executor.py \
            tests/unit/runtime_worker/test_rowset_effect_staging.py -q
      - name: Prove service-boundary canaries
        run: python -m pytest tools/test_check_service_boundaries.py -q
      - name: Publish D9 conformance report
        run: |
          PYTHONPATH="services/ai-backend/src:packages/service-contracts/src" \
            python tools/check_e2_final_conformance.py --json | tee e2-final-conformance.json
      - name: Enforce D9 release readiness
        if: github.event_name == 'workflow_dispatch' && inputs.require_all
        run: |
          PYTHONPATH="services/ai-backend/src:packages/service-contracts/src" \
            python tools/check_e2_final_conformance.py --require-all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2-final-conformance
          path: e2-final-conformance.json
