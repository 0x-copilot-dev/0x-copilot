# Apply deploy/branch-protection.json to the repository as rulesets.
#
# Manual dispatch only: the source of truth lives in git so changes are reviewable
# before they take effect, but a repo admin must run this workflow to push them.
#
#   Dry-run: leave dry_run=true (default) to print the diff without applying.
#   Apply:   set dry_run=false.
#
# The logic lives in tools/apply_branch_protection.py, not in a heredoc here. The
# previous inline version had a module-level `return` and died with
# `SyntaxError: 'return' outside function` on every dispatch, so the rulesets it
# described were never applied and `main` sat completely unprotected. A heredoc is
# invisible to ruff, to pytest and to review; a module is covered by
# tools/test_apply_branch_protection.py, which also fails the build if any
# workflow grows a non-compiling embedded script again.

name: apply-branch-protection

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the diff between the repo and deploy/branch-protection.json without applying
        type: boolean
        default: true

# There is deliberately no `administration: write` here. It is NOT a valid
# GITHUB_TOKEN permission: adding it makes the whole workflow unparseable
# ("Unexpected value 'administration'") and every dispatch fails with HTTP 422
# before a single step runs -- which is exactly what happened the first time this
# was dispatched. Repository administration is not delegable to GITHUB_TOKEN at
# all, so writing rulesets needs a fine-grained PAT carrying the repository
# "Administration: read and write" permission, stored as REPO_ADMIN_TOKEN.
#
# Without that secret this workflow still DRY RUNS, which is the half that
# matters in review. To apply without creating a PAT, a repo admin runs the same
# code path locally:
#
#   GITHUB_REPOSITORY=0x-copilot-dev/0x-copilot \
#     PYTHONPATH=tools python tools/apply_branch_protection.py --dry-run
#
# then --apply. Only the credential differs.
permissions:
  contents: read

concurrency:
  group: apply-branch-protection
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # The gate runs before the apply, not after: a config that cannot load, or
      # a workflow carrying a broken embedded script, must never reach the API.
      - name: Test the reconciler and validate the config
        run: PYTHONPATH=tools python -m pytest tools/test_apply_branch_protection.py -q

      - name: Reconcile rulesets
        env:
          # REPO_ADMIN_TOKEN when present; GITHUB_TOKEN otherwise, which can read
          # and diff but will 403 on a write.
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          HAS_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN != '' }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            python tools/apply_branch_protection.py --dry-run
            exit 0
          fi
          # Say why, rather than surfacing a bare 403 from the API.
          if [ "${HAS_ADMIN_TOKEN}" != "true" ]; then
            echo "::error::Applying needs REPO_ADMIN_TOKEN (fine-grained PAT, repository Administration: read and write)."
            echo "::error::GITHUB_TOKEN cannot be granted repository administration. Add that secret, or run the script locally as this workflow's header documents."
            exit 1
          fi
          python tools/apply_branch_protection.py --apply
