# Repository-wide static gates.
#
# Replaces ci-dark-capabilities-gate.yml, ci-orphan-destinations.yml and
# ci-css-selector-shadowing.yml, which were three ~70-line workflows running the
# identical five steps (checkout, setup-python, pip install pytest, pytest the
# gate, run the gate) and paying three runner startups to do it.
#
# One job, one required check context. That last part matters most: a required
# status check must be one that ALWAYS runs, and the old per-gate workflows were
# each path-filtered, so none of them could safely be required. `repo-gates` is
# unconditional (see below), which is what puts these gates on the
# branch-protection list at all.
#
# Adding a gate: drop tools/check_<name>.py + tools/test_check_<name>.py, then add
# both to the steps below. Nothing to wire into a paths filter -- there isn't one.
#
# THAT LAST SENTENCE IS THE JOB, AND IT WAS NOT BEING DONE. A generative-UI audit
# (docs/audit/generative-ui/FINDINGS.md 4.6a) enumerated tools/check_*.py against
# .github/workflows/ and found FIVE gates -- audit-in-transaction, F-series
# contract authority map, LLM provider imports, migration manifest, reader
# methods -- referenced by zero workflows, each with a companion test that also
# never ran. Written, reviewed, merged, and then silent: our own dark-capability
# pathology, applied to the gates that exist to catch it. All five are wired
# below. A gate that runs nowhere is not a weaker gate, it is a comment.

name: ci-gates

# DELIBERATELY UNCONDITIONAL -- no `paths:` filter anywhere below.
#
# repo-gates is a REQUIRED status check on dev, and a required check must always
# run. GitHub treats one that never reports as pending forever, so a
# path-filtered required check silently blocks every PR that misses its paths.
# That is not hypothetical: this workflow shipped with a paths filter, and the
# very next PR -- which touched tools/apply_branch_protection.py, a path the
# filter did not list -- went straight to mergeStateStatus BLOCKED, waiting on a
# job that was never going to start.
#
# The rule is therefore: required <=> unconditional. ci-repo (lint-and-secrets,
# tenants-lint) is unconditional for the same reason. The whole job is ~45s, so
# running it on every PR costs far less than one blocked merge.
on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ci-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-gates:
    name: repo-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # pyyaml: test_desktop_journey_ci.py parses .github/workflows/ci-desktop.yml
      # to check the per-PR desktop-journey job against the journey it pins.
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest pyyaml

      # Each gate is tested before it is trusted: a gate whose own tests fail is
      # not evidence about the repository, it is a broken instrument. Every gate
      # run below appears here first -- that is the ordering invariant, not a
      # convention.
      - name: Test the gates
        run: |
          PYTHONPATH=tools python -m pytest -q \
            tools/test_check_dark_capabilities.py \
            tools/test_check_orphan_destinations.py \
            tools/test_check_route_reachability.py \
            tools/test_check_css_selector_shadowing.py \
            tools/test_check_service_boundaries.py \
            tools/test_check_audit_in_transaction.py \
            tools/test_check_f_series_contract_authority_map.py \
            tools/test_check_llm_provider_imports.py \
            tools/test_check_migration_manifest.py \
            tools/test_check_reader_methods.py \
            tools/test_check_dark_wiring.py \
            tools/test_apply_branch_protection.py \
            tools/test_cli_release.py \
            tools/test_desktop_journey_ci.py \
            tools/test_harness_bench_heavy_tasks.py

      - name: Dark capabilities
        run: python tools/check_dark_capabilities.py

      - name: Orphan destinations
        run: python tools/check_orphan_destinations.py

      # The HTTP-layer sibling of the gate above: a route registered in
      # ai-backend that no app, no facade route and no backend caller names is
      # unreachable from the product. 13 such routes already exist and are
      # recorded with a reason each in tools/route_reachability_baseline.txt;
      # this fails on the 14th, and on any baseline line that has gone stale.
      - name: Route reachability
        run: python tools/check_route_reachability.py

      # The sub-module sibling of the two gates above. Those catch a whole
      # module nobody imports and a whole capability no test turns on; this one
      # catches the same defect one level down, where the population actually
      # lives -- a symbol only a test reaches, a capability only one store
      # backend can serve, a validated field spent on an f-string in a prompt.
      # 306 such symbols already exist and are recorded with a reason each in
      # tools/dark_wiring_baseline.txt; this fails on the 307th, and on any
      # baseline line that has gone stale.
      - name: Dark wiring
        run: python tools/check_dark_wiring.py

      - name: CSS selector shadowing
        run: python tools/check_css_selector_shadowing.py

      - name: Service boundaries
        run: python tools/check_service_boundaries.py

      - name: Audit writes stay in their transaction
        run: python tools/check_audit_in_transaction.py

      - name: F-series contract authority map
        run: python tools/check_f_series_contract_authority_map.py

      - name: LLM provider imports
        run: python tools/check_llm_provider_imports.py

      - name: Reader methods contain no write SQL
        run: python tools/check_reader_methods.py

      - name: Migration manifests
        run: python tools/check_migration_manifest.py
