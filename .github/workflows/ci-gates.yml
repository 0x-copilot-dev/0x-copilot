# Repository-wide static gates.
#
# Replaces ci-dark-capabilities-gate.yml, ci-orphan-destinations.yml and
# ci-css-selector-shadowing.yml, which were three ~70-line workflows running the
# identical five steps (checkout, setup-python, pip install pytest, pytest the
# gate, run the gate) and paying three runner startups to do it.
#
# One job, one required check context. That last part matters most: a required
# status check must be one that ALWAYS runs, and the old per-gate workflows were
# each path-filtered, so none of them could safely be required. `repo-gates` is
# unconditional (see below), which is what puts these gates on the
# branch-protection list at all.
#
# Adding a gate: drop tools/check_<name>.py + tools/test_check_<name>.py, then add
# both to the steps below. Nothing to wire into a paths filter -- there isn't one.

name: ci-gates

# DELIBERATELY UNCONDITIONAL -- no `paths:` filter anywhere below.
#
# repo-gates is a REQUIRED status check on dev, and a required check must always
# run. GitHub treats one that never reports as pending forever, so a
# path-filtered required check silently blocks every PR that misses its paths.
# That is not hypothetical: this workflow shipped with a paths filter, and the
# very next PR -- which touched tools/apply_branch_protection.py, a path the
# filter did not list -- went straight to mergeStateStatus BLOCKED, waiting on a
# job that was never going to start.
#
# The rule is therefore: required <=> unconditional. ci-repo (lint-and-secrets,
# tenants-lint) is unconditional for the same reason. The whole job is ~45s, so
# running it on every PR costs far less than one blocked merge.
on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ci-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-gates:
    name: repo-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # Each gate is tested before it is trusted: a gate whose own tests fail is
      # not evidence about the repository, it is a broken instrument.
      - name: Test the gates
        run: |
          PYTHONPATH=tools python -m pytest -q \
            tools/test_check_dark_capabilities.py \
            tools/test_check_orphan_destinations.py \
            tools/test_check_css_selector_shadowing.py \
            tools/test_check_service_boundaries.py \
            tools/test_apply_branch_protection.py \
            tools/test_cli_release.py

      - name: Dark capabilities
        run: python tools/check_dark_capabilities.py

      - name: Orphan destinations
        run: python tools/check_orphan_destinations.py

      - name: CSS selector shadowing
        run: python tools/check_css_selector_shadowing.py

      - name: Service boundaries
        run: python tools/check_service_boundaries.py
