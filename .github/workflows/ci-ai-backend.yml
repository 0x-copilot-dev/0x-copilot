name: ci-ai-backend

on:
  pull_request:
    paths:
      - "services/ai-backend/**"
      - "services/ai-backend/requirements.in"
      - "services/ai-backend/requirements-dev.in"
      - "packages/service-contracts/**"
      - "packages/api-types/**"
      - "packages/audit-chain/**"
      - ".github/workflows/ci-ai-backend.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "services/ai-backend/**"
      - "services/ai-backend/requirements.in"
      - "services/ai-backend/requirements-dev.in"
      - "packages/service-contracts/**"
      - "packages/api-types/**"
      - "packages/audit-chain/**"
      - ".github/workflows/ci-ai-backend.yml"
  workflow_dispatch:

concurrency:
  group: ci-ai-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/ai-backend/requirements.txt
            services/ai-backend/requirements-dev.txt

      - name: Install tooling and service deps
        run: |
          python -m pip install --upgrade pip pip-audit cyclonedx-bom
          python -m pip install ./packages/service-contracts
          python -m pip install ./packages/audit-chain
          # requirements-dev.txt is the compiled SUPERSET: requirements-dev.in
          # starts with `-r requirements.in`, so the lock inlines the whole
          # runtime closure plus the pinned test tooling, every entry hashed.
          # The pip-audit and SBOM steps below stay on the RUNTIME lock on
          # purpose — they must describe only what ships.
          python -m pip install -r services/ai-backend/requirements-dev.txt --require-hashes

      - name: Verify the locks are compiled from their .in files
        run: |
          # pip is pinned below 26.2 alongside pip-tools. pip 26.2 removed
          # `pip._internal.utils.compat.stdlib_pkgs`, which pip-tools imports
          # via piptools/sync.py while validating its config file — so
          # `pip-compile` dies on import, not on resolution. Verified
          # locally: 25.2-26.1 export it, 26.2 does not, and pip-tools 7.6.0
          # imports it too, so bumping pip-tools does not help. The earlier
          # step upgrades pip unpinned, which is how this reached main.
          python -m pip install 'pip<26.2' pip-tools==7.5.3
          cd services/ai-backend
          # NOTE: never add `--upgrade` here. pip-compile treats the EXISTING
          # lock as a constraint set, so this re-resolve is stable — it does not
          # drift when an unpinned transitive dep publishes a new release, which
          # is what keeps this gate from going red on unrelated PRs. Verified:
          # an unconstrained resolve of this same requirements.in wants
          # mcp 2.0.0 (vs the pinned 1.29.0), rpds-py 2026.6.3 and httpx2.
          # Upgrades are a deliberate, reviewed `pip-compile --upgrade` commit.
          pip-compile --generate-hashes --resolver=backtracking requirements.in -o requirements.txt
          pip-compile --generate-hashes --resolver=backtracking requirements-dev.in -o requirements-dev.txt
          cd ../..
          # A hand-edited lock is the failure this catches. `mcp==1.29.0`
          # silently pulled jsonschema, httpx-sse, referencing, rpds-py and
          # jsonschema-specifications into the old flat pin list without
          # listing them, so pip-audit and the SBOM never saw them.
          git diff --exit-code services/ai-backend/requirements.txt services/ai-backend/requirements-dev.txt

      - name: Verify installed dependency graph (pip check)
        run: cd services/ai-backend && python -m pip check

      - name: Audit Python dependencies (ai-backend only)
        run: pip-audit -r services/ai-backend/requirements.txt

      - name: Run pytest (ai-backend only)
        run: |
          # Stream node IDs so a hosted-runner stall leaves actionable evidence
          # in Actions logs. The duration report also guards against silently
          # growing full-suite time as coverage expands.
          cd services/ai-backend && PYTHONUNBUFFERED=1 PYTHONPATH="../../packages/service-contracts/src:src" python -m pytest tests -vv --durations=30

      - name: A10 RBAC scope coverage check
        # Default-deny: every route must declare its RBAC policy via
        # RequireScopes / RequireRoles / RequireAnyScope / public_route.
        # Adding a new route without an annotation fails this step.
        run: |
          cd services/ai-backend && PYTHONPATH="../../packages/service-contracts/src:src" python ../../tools/check_route_scopes.py --service ai-backend

      - name: Generate SBOM (ai-backend)
        run: |
          mkdir -p artifacts/sbom
          cyclonedx-py requirements services/ai-backend/requirements.txt -o artifacts/sbom/ai-backend.bom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-ai-backend
          path: artifacts/sbom/ai-backend.bom.json
