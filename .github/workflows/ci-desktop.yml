name: ci-desktop

# Typecheck + vitest for the Electron desktop app. Nothing else in CI exercises
# apps/desktop (release-desktop.yml only builds installers on a tag), so without
# this workflow a desktop-only regression — main-process auth posture, the
# renderer shell, the ~830-test main/renderer suite — could merge unnoticed.
#
# Path filter covers apps/desktop and EVERY workspace package the desktop
# imports (its package.json dependencies resolve to those packages' source, so a
# breaking API change there surfaces in the desktop typecheck), plus the root
# manifests / base tsconfig / this workflow file.

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/api-types/**"
      - "packages/chat-surface/**"
      - "packages/chat-transport/**"
      - "packages/design-system/**"
      - "packages/surface-renderers/**"
      - "tools/check-playwright-version.mjs"
      - "tools/cli/package.json"
      - "tools/cli-testing/package.json"
      - "tools/cli-testing/package-lock.json"
      - "tools/cli-testing/harness/**"
      - "tools/desktop-journeys/**"
      - "tools/desktop-runtime/manifest.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/ci-desktop.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/desktop/**"
      - "packages/api-types/**"
      - "packages/chat-surface/**"
      - "packages/chat-transport/**"
      - "packages/design-system/**"
      - "packages/surface-renderers/**"
      - "tools/check-playwright-version.mjs"
      - "tools/cli/package.json"
      - "tools/cli-testing/package.json"
      - "tools/cli-testing/package-lock.json"
      - "tools/cli-testing/harness/**"
      - "tools/desktop-journeys/**"
      - "tools/desktop-runtime/manifest.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/ci-desktop.yml"
  workflow_dispatch:

concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Verify shared Playwright version
        run: npm run check:playwright-version

      # The desktop typecheck (tsc -p tsconfig.json --noEmit) resolves the
      # @0x-copilot/* workspace deps to their source, so this transitively
      # type-checks the parts of those packages the desktop actually imports —
      # no prior build of the deps is required.
      - name: Typecheck desktop
        run: npm run typecheck --workspace @0x-copilot/desktop

      # The main/* lifecycle tests await a real async fs pipeline via fixed-tick
      # polling and flake under parallel-file contention (worse on 2-core
      # runners), so do not add -p/--pool overrides here that would increase file
      # parallelism. NOTE: an earlier version of this comment claimed
      # vitest.config.ts pins fileParallelism:false; it does not, and
      # native-workspace-commit-helper.test.ts's "atomically admits exactly one of
      # two helpers" case was observed failing on roughly one full-suite run in
      # two locally, on unmodified code. That flake is not the addon's and is
      # recorded here rather than left as a false claim.
      #
      # `test` also builds the workspace-fs addon and runs its node:test suite.
      # That is deliberately BEST-EFFORT here (build.mjs warns and exits 0 without
      # a toolchain, and openBeneath.test.mjs then skips with a stated reason), so
      # this job never fails for a native-build reason. On a runner that does have
      # the toolchain it is free coverage of the Linux openat2 branch. The
      # platforms whose shipped read path depends on the addon are gated hard in
      # the native-workspace-fs job below.
      - name: Run desktop tests
        run: npm run test --workspace @0x-copilot/desktop

  # The addon this job builds was ORPHANED: no build script, no packaging entry,
  # no CI. loadNativeWorkspaceFs() therefore never found a binary, and every
  # confined read on Windows fell through to a post-open realpath recheck — the
  # same denials, non-atomically, i.e. a TOCTOU window per read. macOS survived
  # because its pure-Node open already carries O_NOFOLLOW_ANY.
  #
  # So this job exists to keep two claims true:
  #   1. the addon still COMPILES on the platforms the app ships to, and
  #   2. it still actually CONFINES — openBeneath.test.mjs drives a real temp
  #      tree, a real junction/symlink and a real read on each runner.
  # The Win32 NtCreateFile walk in src/workspace_fs.c had never been compiled by
  # anything, let alone executed; the windows-latest leg is the only evidence
  # that it works.
  native-workspace-fs:
    name: native workspace-fs (${{ matrix.os }})
    strategy:
      # Report both platforms; a Windows failure must not be masked by macOS.
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      # --ignore-scripts skips electron's postinstall (a ~100 MB download this job
      # has no use for). node-gyp is still installed, which is all the addon build
      # needs. Node-API means the artifact is runtime-agnostic, so there is
      # nothing to rebuild against Electron's ABI.
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # `:required` makes a toolchain failure, a missing binary, or a failed
      # selfcheck a job failure. build.mjs finishes by running selfcheck.cjs
      # against the emitted binary, so "compiled" alone is not accepted as
      # success — the binary has to read real bytes and refuse a real escape.
      - name: Build the workspace-fs addon
        run: npm run build:workspace-fs:required --workspace @0x-copilot/desktop

      - name: Test the workspace-fs addon
        run: npm run test:native --workspace @0x-copilot/desktop

  # ── ONE real user journey against the BUILT app, on every PR ────────────────
  #
  # tools/desktop-journeys/ drives the real packaged app — supervised Electron +
  # embedded PostgreSQL + all three Python services — through the Playwright
  # control server, clicking real testIds. It has repeatedly caught
  # "unit-tests-pass-but-the-real-app-is-broken" regressions, and until this job
  # NOTHING ran it on a PR: `grep -rln desktop-journeys .github/workflows/`
  # returned zero files. desktop-supervised-boot-drill.yml is the nearest thing
  # and it is schedule + dispatch + tools/desktop-runtime paths only, driving the
  # stack as a STAGING process rather than through the shipped app.
  #
  # Four constraints shape this job. Each is load-bearing; none is style.
  #
  # 1. EXACTLY ONE PHASE, pinned by JOURNEY_PHASES below. Since e8622a1d the
  #    phases in a journey file share ONE boot and consume each other's state on
  #    purpose, so running the whole file per-PR would inherit stale route / rail
  #    / env / run-history and fail in a LATER phase with a symptom-shaped
  #    message that reads exactly like a product bug. FR-0 is first, so it
  #    consumes nothing.
  #
  # 2. NO SECRETS, NO THIRD-PARTY CALL. FR-0 is the only phase that needs no
  #    provider key and drives no model: it asserts the keyless BYOK gate and
  #    that the catalog, read through the app, reports nothing configured.
  #    NOTE ON THE FAKE MODEL: RUNTIME_FAKE_MODEL=1 is what the boot drill uses,
  #    and it is deliberately unreachable from here. `buildServiceEnv` starts
  #    from {} and copies only ENV_PASSTHROUGH_ALLOWLIST
  #    (apps/desktop/main/services/service-env.ts), which does not contain it —
  #    that is the fail-closed guarantee stated in
  #    agent_runtime/execution/fake_model.py ("the shipped desktop never sets
  #    it"). Setting it in this job's env would be a no-op that reads like
  #    coverage, so it is not set. The hermetic run->stream tail stays where it
  #    can actually run: desktop-supervised-boot-drill.yml.
  #
  # 3. STAGE FRESH. <COPILOT_HOME>/runtime/**/services/** is a COPY of services/*
  #    taken at stage time and nothing re-syncs it, so a cached stage would test
  #    code the PR deleted. Only the DOWNLOADS (CPython + PostgreSQL tarballs)
  #    are cached; the stage itself is rebuilt from this commit's tree.
  #
  # 4. NOT A REQUIRED CHECK. A new e2e gate needs a few runs of observed
  #    stability before anything is allowed to block on it. Requiring it also
  #    means making it unconditional (see the ci-gates.yml header) — this job is
  #    path-filtered and macOS-billed, so that is a separate, deliberate step.
  desktop-journey-first-run:
    name: desktop journey (first_run FR-0)
    # Apple Silicon: the staged runtime manifest ships darwin/win32 only, and
    # this is the arch whose bundle the runner can both download and execute.
    runs-on: macos-14
    timeout-minutes: 45
    env:
      # THE ONE-PHASE CONSTRAINT, in one place. _lib.py's JourneyPlan runs only
      # the phases named here and drops the rest; naming an id the journey does
      # not declare exits 1 rather than passing an empty run, so renaming FR-0
      # cannot leave this job green over nothing.
      JOURNEY_PHASES: FR-0
      # Port 8790 is _lib.py's default and collides with a driver left over from
      # a previous run. A hosted runner is ephemeral so nothing is left over, and
      # `concurrency:` above cancels a same-ref run before this one starts —
      # a distinct port is belt-and-braces, chosen rather than derived so the
      # value in a failing log is the value written here.
      CTL_PORT: "8791"
      # A first boot on a fresh profile runs initdb + migrations + three
      # uvicorns. Hosted macOS is slower than a laptop at all three, and this
      # number is measured rather than guessed: on a warm M-series laptop, with
      # the runtime already staged, launch → the sign-in gate took 110s (94s of
      # it after the window existed). 420 leaves a wide margin over that.
      #
      # It governs BOTH waits, which is the whole reason the job works:
      #   * _lib.py `_probe()` — how long until the driver's control server
      #     answers, i.e. until the first WINDOW exists; and
      #   * `DriverSession.wait_for_app_ready` — how long the app may keep
      #     showing `boot-gate` (BootProgress.tsx) after that.
      # Those are different moments. The window appears in ~9s; the services
      # behind it take ~100s more. Before the second wait existed, every journey
      # went straight to `wait_for(..., timeout_s=60)` and failed with
      # "sign-in gate never appeared" — a box timeout wearing a product
      # failure's clothes, and a red gate on this job's very first run.
      BOOT_TIMEOUT_S: "420"
      DRIVER_LAUNCH_TIMEOUT_MS: "300000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      # _lib.py needs 3.11+ (StrEnum). Pinned rather than trusting whatever
      # `python3` the image happens to ship, because that failure is an import
      # error minutes into a 45-minute job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # DOWNLOAD cache only (CPython + PostgreSQL tarballs), keyed on the pinned
      # manifest so a re-pin busts it. The staged tree itself is never cached —
      # see constraint 3 above. Same cache the boot drill uses.
      - name: Cache desktop runtime downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/enterprise-desktop-runtime
          key: desktop-runtime-${{ runner.os }}-arm64-${{ hashFiles('tools/desktop-runtime/manifest.json') }}
          restore-keys: |
            desktop-runtime-${{ runner.os }}-arm64-

      # Installs playwright (driver.mjs launches Electron through it) and the
      # electron binary the driver resolves from this checkout's node_modules.
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      # Fresh stage from THIS commit's services/*. Ad-hoc code-signing so the
      # freshly extracted mach-o binaries execute without a Developer ID.
      - name: Stage self-contained runtime (darwin-arm64, ad-hoc signed)
        run: node tools/desktop-runtime/stage.mjs --platform darwin --arch arm64 --adhoc-sign

      # The driver launches apps/desktop/out/**, not the TypeScript sources.
      - name: Build the desktop bundle
        run: npm run build --workspace @0x-copilot/desktop

      # THE JOURNEY. Exit 0 only if FR-0 ran and passed: a skip (3) or a blocked
      # (2) is non-zero by design, so an absent stage or a vanished phase id
      # cannot be mistaken for success.
      - name: One live journey phase against the built app
        env:
          # The `source` target's default is this path, but naming it is what
          # keeps the preflight and the launch pointed at the stage built above.
          COPILOT_HOME: ${{ github.workspace }}/apps/desktop/resources
        run: python3 tools/desktop-journeys/first_run.py

      # The four supervised services write their logs under the app's userData
      # dir, which is OUTSIDE the workspace. Copy them next to the screenshots so
      # one in-workspace path carries every piece of evidence.
      #
      # Done in the shell on purpose. An upload `path:` beginning with `~` is
      # expanded by @actions/glob, not by bash, and `if-no-files-found: warn`
      # downgrades a miss to a warning — so getting it wrong loses the service
      # logs silently, in precisely the red run that needed them. `$HOME` here is
      # expanded by the shell, which is verifiable. No `${{ }}` in the script
      # body: a substituted value is a script-injection vector (ci-gates header).
      - name: Collect supervised service logs
        if: failure()
        run: |
          for logs in "$HOME/Library/Application Support/0xCopilot"/journey-first-run-*/logs; do
            [ -d "$logs" ] || continue
            dest="tools/desktop-journeys/runs/services-$(basename "$(dirname "$logs")")"
            mkdir -p "$dest"
            cp "$logs"/*.log "$dest"/ 2>/dev/null || true
          done
          find tools/desktop-journeys/runs -type f | sed 's/^/  evidence: /'

      # Screenshots, driver.log (Electron main), and the supervised services'
      # logs. Without these a red run on a runner nobody can ssh into is
      # unreadable.
      - name: Upload journey evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-journey-first-run-evidence
          path: tools/desktop-journeys/runs/**
          if-no-files-found: warn
          retention-days: 7
