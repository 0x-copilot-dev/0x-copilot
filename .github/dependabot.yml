version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    reviewers:
      - 0x-copilot/security-reviewers
    commit-message:
      prefix: "ci(deps)"
      include: scope
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: pip
    directory: /services/backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch
    reviewers:
      - 0x-copilot/backend-owners
      - 0x-copilot/security-reviewers
    commit-message:
      prefix: "deps(backend)"
      include: scope
    labels:
      - dependencies
      - python
      - backend

  - package-ecosystem: pip
    directory: /services/backend-facade
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      facade-minor-patch:
        update-types:
          - minor
          - patch
    reviewers:
      - 0x-copilot/backend-owners
      - 0x-copilot/security-reviewers
    commit-message:
      prefix: "deps(facade)"
      include: scope
    labels:
      - dependencies
      - python
      - backend-facade

  - package-ecosystem: pip
    directory: /services/ai-backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      ai-backend-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # marshmallow 4 is unreachable while we depend on langchain-community
      # (it pulls in dataclasses-json==0.6.7, which hard-pins marshmallow<4).
      # No newer dataclasses-json exists. Re-enable when langchain-community
      # ships a release that uses a marshmallow-4-compatible
      # dataclasses-json.
      - dependency-name: marshmallow
        update-types:
          - version-update:semver-major
      # pydantic-monty is held at 0.0.18. 0.0.19 is not a version bump: it
      # replaces the in-process `Monty(code).start(...)` /
      # `FunctionSnapshot.resume` model that
      # agent_runtime/capabilities/interpreter/monty_adapter.py is built on
      # with a subprocess worker pool — `Monty` becomes a context manager
      # whose only method is `checkout`, and code reaches the interpreter
      # through `MontySession.feed_start` / `feed_run`. Porting the adapter
      # to that lifecycle is a design change to a capability that is gated
      # off by default (`runtime_enable_monty` defaults False), and
      # tools/desktop-runtime/features/monty-requirements.txt has to move in
      # the same commit or the desktop opt-in installs a wheel the adapter
      # cannot drive.
      #
      # Ignored rather than pinned-with-a-comment because dependabot
      # proposed 0.0.19 twice (#589, #600), the second time straight past a
      # HELD comment sitting on the line above the pin. Drop this entry as
      # part of the adapter port, not before.
      - dependency-name: pydantic-monty
    reviewers:
      - 0x-copilot/ai-runtime-owners
      - 0x-copilot/security-reviewers
    commit-message:
      prefix: "deps(ai-backend)"
      include: scope
    labels:
      - dependencies
      - python
      - ai-backend

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # DELIBERATELY UNGROUPED. A grouped npm update rewrites package-lock.json
    # in one full re-resolve; a single-package update edits it surgically.
    # That difference is not cosmetic here, because this lockfile cannot be
    # re-resolved back into its current shape:
    #
    #   * `@typescript-eslint/parser` declares peer `typescript >=4.8.4 <6.1.0`
    #     and the workspace is on typescript 7, so any resolve needs
    #     `--legacy-peer-deps`. `npm ci` never re-resolves peers, which is the
    #     only reason CI is green on the committed lock.
    #   * The committed lock keeps apps/website's `@img/sharp-*` binaries
    #     nested under apps/website. Every current npm hoists them to the root
    #     instead, which leaves them extraneous and makes website's pinned
    #     react-dom invalid — `npm ls` then exits ELSPROBLEMS and the SBOM step
    #     fails with it.
    #
    # PR #585 was exactly that: 23 valid bumps that could not land, while the
    # single-package PRs beside it (#586, #587, #588) merged untouched. Restore
    # grouping only once the lock is reproducible from package.json.
    ignore:
      # zod 4 is a breaking major, deferred deliberately: zod is pinned in
      # lockstep across the chat-transport and desktop surfaces, so it must
      # move as one coordinated migration — not via an automated bump.
      - dependency-name: zod
        versions:
          - ">=4"
      # recharts 3 is a breaking major, deferred deliberately: v3 is a full
      # API rewrite; chart migrations happen intentionally, not via
      # automated bumps.
      - dependency-name: recharts
        versions:
          - ">=3"
    reviewers:
      - 0x-copilot/frontend-owners
      - 0x-copilot/security-reviewers
    commit-message:
      prefix: "deps(npm)"
      include: scope
    labels:
      - dependencies
      - npm

  - package-ecosystem: docker
    directories:
      - /services/backend
      - /services/backend-facade
      - /services/ai-backend
      - /apps/frontend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    reviewers:
      - 0x-copilot/security-reviewers
    commit-message:
      prefix: "deps(docker)"
      include: scope
    labels:
      - dependencies
      - docker
