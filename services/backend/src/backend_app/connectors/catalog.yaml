# Connectors the product advertises but cannot install yet.
#
# DELIBERATELY EMPTY. The file and its machinery stay; the rows are gone.
#
# It once held three slugs — gcal, slack, salesforce — that resolved to no MCP
# server in any deployment. They were rendered with a Connect button that could
# not succeed, and then (briefly) with an honest "Coming soon" chip. Neither is
# what a connector picker is for: a row the user cannot act on is clutter at
# best and a broken promise at worst. A connector earns a row by being
# connectable, not by being planned.
#
# The machinery is retained precisely because it is the guard. Any row added
# back here resolves `installable=False` through `ConnectorRegistry`, and there
# is deliberately no endpoint field to fill in — a row cannot become
# installable by editing this file. It becomes installable by gaining a seed in
# `mcp_catalog.py` or a profile in `desktop_profiles.yaml`, at which point the
# registry prefers that source and `superseded_announcements()` reports the
# leftover row so this file self-cleans.
#
# So: if you are about to add a slug here, add it to `mcp_catalog.py` or
# `desktop_profiles.yaml` instead. If it cannot go in either of those yet, it
# does not belong in the product's connector list yet either.
#
# `note` is shown to the user, so write it as a status, not an apology.

