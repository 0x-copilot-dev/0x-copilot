# Connectors the product advertises but cannot install yet.
#
# This file used to be a second connector catalog: nine marketing slugs the
# Tools destination rendered on its "Available" tab, overlapping the thirteen
# real MCP servers in `mcp_catalog.DEFAULT_CATALOG` by exactly three. The two
# lists disagreed, so the composer and the destination showed different
# products. Six of the nine now resolve from a profile or a seed and have been
# removed from here; what remains was never a catalog entry at all — it is a
# promise.
#
# Every row here resolves `installable=False` through `ConnectorRegistry`, and
# there is deliberately no endpoint field to fill in. A row cannot become
# installable by editing this file. It becomes installable by gaining a seed
# in `mcp_catalog.py` or a profile in `desktop_profiles.yaml`, at which point
# the registry prefers that source and `superseded_announcements()` reports
# the leftover row so this file self-cleans.
#
# `note` is shown to the user, so write it as a status, not an apology.
#
# The rule this file exists to keep: a card may say "coming soon", but no card
# may offer a Connect button that resolves to nothing. That is exactly what
# these three slugs did, in every deployment, until the registry landed.

entries:
  - slug: gcal
    display_name: Google Calendar
    description: Meetings, agendas, and availability.
    icon_hint: gcal
    note: Not yet available. Gmail and Drive connect the same way today.
  - slug: slack
    display_name: Slack
    description: Channels, DMs, and threads.
    icon_hint: slack
    note: Not yet available.
  - slug: salesforce
    display_name: Salesforce
    description: Accounts, contacts, and pipeline.
    icon_hint: salesforce
    note: Not yet available.
