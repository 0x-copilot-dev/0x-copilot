[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime"
version = "0.1.0"
description = "Agent runtime foundation for the enterprise work surface"
requires-python = ">=3.13"
dependencies = [
  "deepagents==0.7.1",
  "ddgs==9.14.4",
  "fastapi==0.139.2",
  "langchain==1.3.14",
  "langchain-openai==1.3.5",
  "langchain-anthropic==1.4.8",
  "langchain-google-genai==4.2.7",
  "litellm==1.93.0",
  "langgraph==1.2.9",
  # Upstream authority for provider model metadata, pricing, and preflight
  # token counting. Desktop packages it into the prebuilt runtime; it is never
  # replaced by a locally-maintained per-model catalog.
  "litellm==1.93.0",
  # SQLite-backed LangGraph checkpointer for the single_user_desktop file store
  # (durable graph/approval continuation across worker restart). Desktop path
  # only; postgres/in-memory keep InMemorySaver. Pulls in aiosqlite.
  "langgraph-checkpoint-sqlite==3.1.0",
  # Postgres-backed LangGraph checkpointer for server deployments
  # (RUNTIME_STORE_BACKEND=postgres); durable graph/approval continuation across
  # worker restart. Lockstep sibling of the sqlite pin; reuses psycopg[pool].
  "langgraph-checkpoint-postgres==3.1.0",
  "openai==2.46.0",
  "anthropic==0.117.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "python-dotenv==1.2.2",
  "python-multipart==0.0.32",
  "uvicorn==0.51.0",
  "gunicorn==26.0.0",
  "httpx==0.28.1",
  # Retry/backoff for transient tool failures (agent_runtime.capabilities
  # .retrying_tool). Already resolved transitively via langchain-core; declared
  # here because it is now imported directly. Pin matches requirements.txt.
  "tenacity==9.1.4",
  "psycopg[binary,pool]==3.3.4",
  "pyyaml==6.0.3",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-instrumentation-httpx==0.65b0",
  "opentelemetry-instrumentation-psycopg==0.65b0",
  "yoyo-migrations==9.0.0",
]

[project.optional-dependencies]
monty = [
  # AC6 embedded Python-subset interpreter. Desktop installs this feature
  # separately only after the user enables Code Mode.
  "pydantic-monty==0.0.18",
]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../../packages/service-contracts/src",
    "../../packages/audit-chain/src",
]
asyncio_mode = "auto"
# ``evals`` is excluded by default (here) so the standing `pytest` / CI
# `pytest tests` run never invokes a live model. The hermetic replay-based eval
# tests are ordinary unit tests (unmarked) and DO run; only the live-model
# matrix under tests/evals/surfaces carries `@pytest.mark.evals`. Run it
# explicitly with `pytest -m evals` (and `SURFACE_SPEC_MODEL` set).
addopts = "--import-mode=importlib -m 'not evals'"
markers = [
    "postgres: conformance/integration case that requires a live PostgreSQL database (skipped by default in CI).",
    "evals: live-model surface-spec eval matrix (EXCLUDED by default; run with `-m evals` and SURFACE_SPEC_MODEL set). Never runs in CI.",
]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = [
    "src",
    "../../packages/service-contracts/src",
    "../../packages/audit-chain/src",
]
pythonVersion = "3.11"
