# gitleaks configuration for 0x-copilot.
#
# `useDefault = true` keeps the FULL upstream gitleaks ruleset — this file only
# ADDS a narrow allowlist for a single, well-known **test fixture**, it never
# disables a detector or exempts a directory (which would risk hiding a real
# leak in tests).
#
# `test-vault-secret-32-chars-min-length-yes` is the deterministic
# `LocalTokenVault` secret used verbatim across the backend test-suite
# (services/backend/tests/test_provider_keys_routes.py,
# test_routines_webhook.py, and the provider-keys custom-endpoint tests). It is
# not a credential — the TokenVault requires a >=32-char key, so the fixture
# spells that out. gitleaks-action only scans a PR's *new* commits, so any test
# file that re-introduces this constant trips `generic-api-key` even though the
# identical string is already on main; this allowlist makes the intent explicit
# and durable instead of relying on scan-range luck.
#
# `enterprise.flags.*` are client feature-flag localStorage keys (e.g.
# `enterprise.flags.surfaces-v2`), not secrets. A `SURFACES_V2_FLAG_KEY = "..."`
# constant trips `generic-api-key` purely on its `*_KEY = "<string>"` shape. We
# allowlist the flag NAMESPACE (a value pattern), never a file or directory, so
# a real secret in the same files is still caught.
#
# `gAAAAABmZm9vYmFy…` is `McpCatalogMixin.CatalogValues.SECRET_CANARY` — a FAKE
# Fernet ciphertext (its plaintext decodes to "foobarsupersecrettoken"). It is
# the negative control for the MCP filesystem catalog: the tests plant it in a
# connector descriptor and assert it never reaches a model-visible file under
# `/mcp/`. It has to LOOK exactly like a leaked vault token for that assertion
# to mean anything, which is precisely why the entropy rule fires on it.
# Allowlisted as a literal value, so a real Fernet token elsewhere still trips.

[extend]
useDefault = true

[allowlist]
description = "Known non-secret test fixtures"
regexes = [
  '''test-vault-secret-32-chars-min-length-yes''',
  '''enterprise\.flags\.[a-z0-9._-]+''',
  # `SURFACES_V2_FLAG_KEY` is the exported constant holding the
  # `enterprise.flags.surfaces-v2` localStorage key; test files compare against
  # the constant (`key === SURFACES_V2_FLAG_KEY`), which gitleaks' generic-api-key
  # rule matches by entropy. Not a secret — allowlist the identifier.
  '''SURFACES_V2_FLAG_KEY''',
  '''gAAAAABmZm9vYmFyc3VwZXJzZWNyZXR0b2tlbg''',
]
